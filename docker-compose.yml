version: "3.9"
services:

  database:
    image: "postgres"
    env_file:
      - "./database/.env"
    expose:
      - 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/db
      - ./backend/test/initSQL.sql:/docker-entrypoint-initdb.d/initSQL.sql
    restart: unless-stopped

  backend:
    build: "./backend"
    ports:
      - "3000:3000"
    env_file: 
      - "backend/.env"
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build: "./frontend"
    env_file: "frontend/.env"
    volumes:
      - frontend_dist:/usr/src/app-front
    restart: unless-stopped

  nginx:
    image: "nginx"
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/var/www/frontend:ro
    restart: unless-stopped

volumes:
  frontend_dist:
  postgres_data: