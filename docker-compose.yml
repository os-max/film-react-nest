version: "3.9"
services:
  postgres_1:
    image: "postgres"
    expose:
      - 5432
    ports:
      - "5432:5432"
    volumes:
      - ./backend/test/initSQL.sql:/docker-entrypoint-initdb.d/initSQL.sql
    environment:
      POSTGRES_USER: "student"
      POSTGRES_PASSWORD: "student"
  backend:
    build: "./backend"
    ports:
      - "3000:3000"
    env_file: 
    - "backend/.env"
    depends_on:
      - postgres_1